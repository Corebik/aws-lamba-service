# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: corebik
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: first-app
# "service" is the name of this project. This will also be added to your AWS resource names.
service: auction-service
frameworkVersion: "4"
useDotenv: true

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: ${env:AWS_NODEJS_RUNTIME, 'nodejs22.x'}
  stage: ${opt:stage, 'dev'}
  region: ${env:AWS_DEFAULT_REGION, 'us-east-1'}
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com
  environment:
    AUCTIONS_TABLE_NAME: ${self:custom.AuctionsTableName.name}
  iamRoleStatements:
    - ${file(iam/AuctionsTableIAM.yml):AuctionsTableIAM}

resources:
  Resources:
    AuctionsTable: ${file(resources/AuctionsTable.yml):AuctionsTable}

custom:
  authorizer: arn:aws:lambda:${aws:region}:${aws:accountId}:function:serverless-auth0-authorizer-${self:provider.stage}-auth
  AuctionsTableName: 
    name: !Ref AuctionsTable
    arn: !GetAtt AuctionsTable.Arn
  serverless-offline:
    httpPort: 5000

build:
  esbuild:
    bundle: true
    minify: false
    format: esm
    target: ${env:ESBUILD_TARGET, 'node22'}
    banner:
      js: "import { createRequire } from 'module'; const require = createRequire(import.meta.url);"

functions:
  createAuction:
    handler: src/handlers/createAuction.handler
    events:
      - http:
          method: POST
          path: /auction
          authorizer:
            arn: ${self:custom.authorizer}
            resultTtlInSeconds: 0
  getAuctions:
    handler: src/handlers/getAuctions.handler
    events:
      - http:
          method: GET
          path: /auctions
          authorizer:
            arn: ${self:custom.authorizer}
            resultTtlInSeconds: 0
  getAuction:
    handler: src/handlers/getAuction.handler
    events:
      - http:
          method: GET
          path: /auction/{id}
          authorizer:
            arn: ${self:custom.authorizer}
            resultTtlInSeconds: 0
  placeBid:
    handler: src/handlers/placeBid.handler
    events:
      - http:
          method: PATCH
          path: /auction/{id}/bid
          authorizer:
            arn: ${self:custom.authorizer}
            type: TOKEN
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0
  processAuctions:
    handler: src/handlers/processAuctions.handler
    # events:
    #   - schedule: rate(1 minute)